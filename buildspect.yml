version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies"
      - pip install -r ./shoppingBackend/requirements.txt
    
  pre_build:
    commands:
      - echo "Begining Docker Compose"
      - docker-compose -f docker-compose.yml up -d
      - sleep 15 
  build:
    commands:
      - echo "Running Tests"
      - pytest

  post_build:
    commands:
      - echo "Stopping services"
      - docker-compose -f docker-compose.yml down
artifacts:
  files:
    - '**/*'