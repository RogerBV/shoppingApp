version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing dependencies"
      - pip install -r ./shoppingBackend/requirements.txt
    
  pre_build:
    commands:
      - echo "Begining Docker Compose"
      - docker-compose -f docker-compose.yml up -d
      - echo "Waiting for database to be ready"
      - until pg_isready -h localhost -p 5432; do echo "Waiting for DB..."; sleep 2; done 
  build:
    commands:
      - echo "Running Tests"
      - pytest shoppingBackend/tests
      - ls -R
      - pwd

  post_build:
    commands:
      - echo "Stopping services"
      - docker-compose -f docker-compose.yml down
artifacts:
  files:
    - '**/*'